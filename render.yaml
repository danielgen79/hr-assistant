# Blueprint de Render: un servicio web con el mismo nombre que el repositorio.
# Los secretos llevan sync: false; se escriben en Render y nunca aquí.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Render publica solo si el pipeline de CI pasa
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
